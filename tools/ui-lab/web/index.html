<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gielinor Go UI Lab</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #1b1b1d; color: #ddd; height: 100vh;
         display: grid; grid-template-columns: 440px 1fr; overflow: hidden; }
  aside { display: flex; flex-direction: column; border-right: 1px solid #333; min-height: 0; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header, .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px;
                 border-bottom: 1px solid #333; }
  input, select, button { font: inherit; color: inherit; background: #2a2a2d; border: 1px solid #444;
                          border-radius: 4px; padding: 3px 7px; }
  button { cursor: pointer; }
  button.on { background: #7a5a2c; }
  #search { width: 100%; }
  #list { overflow: auto; padding: 4px 10px 40px; flex: 1; }
  details { border-bottom: 1px solid #2c2c2f; }
  summary { cursor: pointer; padding: 6px 0; font-weight: 600; }
  summary small { color: #888; font-weight: 400; }
  .row { display: grid; grid-template-columns: 1fr 96px 80px 22px; gap: 6px; align-items: center; padding: 2px 0; }
  .row label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.changed label { color: #ffcc66; }
  .row input[type=range] { padding: 0; width: 100%; }
  .row input[type=number] { width: 80px; }
  .row.color { grid-template-columns: 1fr 44px 132px 22px; }
  .row input[type=color] { padding: 0; width: 44px; height: 22px; }
  #stage { flex: 1; overflow: auto; padding: 16px; }
  #wrap { position: relative; display: inline-block; outline: 1px solid #333; }
  #frame { display: block; image-rendering: pixelated; user-select: none; }
  #boxes { position: absolute; inset: 0; }
  .box { position: absolute; border: 1px dashed rgba(80, 220, 255, .75); cursor: move; touch-action: none; }
  .box:hover { background: rgba(80, 220, 255, .12); }
  .box.picked { border: 2px solid #ffcc33; background: rgba(255, 204, 51, .12); z-index: 2; }
  .box:hover { z-index: 3; }
  /* Handles sit outside the box, so the whole box moves it, however thin it is. */
  .box i { position: absolute; width: 9px; height: 9px; background: #ffcc33; display: none; }
  .box.picked i, .box:hover i { display: block; }
  .box .e { left: 100%; top: calc(50% - 5px); cursor: ew-resize; }
  .box .s { top: 100%; left: calc(50% - 5px); cursor: ns-resize; }
  .box .se { left: 100%; top: 100%; cursor: nwse-resize; }
  #picked { display: none; }
  #status { color: #e88; padding: 0 10px; }
  #note { color: #9d9; padding: 0 10px; }
  #mine { max-height: 34vh; overflow: auto; padding: 0 10px; border-bottom: 1px solid #444; flex: none; }
  .mine { display: grid; grid-template-columns: 1fr auto 22px; gap: 8px; align-items: center; padding: 2px 0; }
  .mine span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mine b { color: #ffcc66; font-weight: 400; white-space: nowrap; }
  #scrub { flex: 1; min-width: 160px; }
</style>
</head>
<body>
<aside>
  <header><input id="search" placeholder="Search controls, e.g. glass, radius, open, hp"></header>
  <div class="bar">
    <button id="undo" title="Ctrl+Z">Undo</button>
    <button id="redo" title="Ctrl+Y">Redo</button>
    <button id="resetAll">Reset all</button>
    <button id="keep" title="Writes the preset into tools/ui-lab/presets, where the build checks it">Save to project</button>
    <button id="export">Export preset</button>
    <button id="import">Load preset</button>
    <span id="count"></span>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
  <div id="note"></div>
  <details id="mine" open hidden><summary>My changes <small id="mineCount"></small></summary><div></div></details>
  <div id="list"></div>
</aside>
<main>
  <header>
    <select id="scene"></select>
    <select id="theme"></select>
    <label>Scale <input id="scale" type="range" min="0.5" max="2.5" step="0.05" value="1">
      <span id="scaleText">1.00</span></label>
    <label>Zoom <select id="zoom"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
    <button id="compare" title="Hold to see the original values">Hold: original</button>
    <button id="edit" title="Drag panes and buttons to move them; drag a yellow handle to resize">Edit layout</button>
  </header>
  <div class="bar">
    <button id="play" class="on">Pause</button>
    <button id="restart">Restart</button>
    <label>Speed <select id="speed"><option value="1">1x</option><option value="0.5">0.5x</option>
      <option value="0.25">0.25x</option><option value="0.1">0.1x</option><option value="2">2x</option></select></label>
    <input id="scrub" type="range" min="0" max="5000" step="10" value="0">
    <span id="time">0 ms</span>
  </div>
  <div class="bar" id="picked">
    <label>Move <select id="mode"><option value="boxes">Panes and buttons</option>
      <option value="elements">Things inside them (bars, text, icons)</option></select></label>
    <span id="pickedText">Drag a box to move it, or a yellow handle to resize it. Arrows move; Shift+arrows resize.</span>
    <span id="textSize" style="visibility: hidden">Text size
      <button id="smaller" title="-">−</button> <button id="bigger" title="+">+</button></span>
    <button id="resetBox" style="visibility: hidden">Reset this one</button>
    <label title="Hold Alt while dragging to turn this off for a moment"><input id="snap" type="checkbox" checked>
      Snap to edges</label>
  </div>
  <div id="status"></div>
  <div id="stage"><div id="wrap"><img id="frame" alt="the chosen part of the plugin's interface" draggable="false">
    <div id="boxes"></div></div></div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
let schema, changed = {}, playing = true, original = false, t = 0, last = performance.now(), busy = false, url = null;

const params = extra => new URLSearchParams(Object.assign(
  { scene: $("scene").value, theme: $("theme").value, scale: $("scale").value, t: Math.round(t) }, extra)).toString();

/* One number for each drag, click or key press, so that undo steps back a whole one. */
let gesture = Date.now();
["pointerdown", "keydown"].forEach(kind => window.addEventListener(kind, () => gesture++, true));

async function post(path, query) {
  const asked = new URLSearchParams(query || "");
  asked.set("g", gesture);
  const reply = await fetch(path + "?" + asked, { method: "POST", headers: { "X-UI-Lab": "1" } });
  if (!reply.ok) $("status").textContent = await reply.text();
  return reply.ok;
}

async function tick() {
  const now = performance.now();
  if (playing) t += (now - last) * Number($("speed").value);
  last = now;
  $("scrub").value = t % 5000;
  $("time").textContent = Math.round(t) + " ms";
  if (!busy) {
    busy = true;
    try {
      const reply = await fetch("/api/frame?" + params(original ? { original: 1 } : {}));
      if (reply.ok) {
        const next = URL.createObjectURL(await reply.blob());
        const image = $("frame");
        image.onload = () => {
          if (url) URL.revokeObjectURL(url);
          url = next;
          image.style.width = image.naturalWidth * Number($("zoom").value) + "px";
        };
        image.src = next;
        $("status").textContent = "";
      } else $("status").textContent = await reply.text();
    } catch (e) { $("status").textContent = "The lab is not running."; }
    busy = false;
  }
  setTimeout(tick, 40);
}

const hex = n => n.toString(16).padStart(2, "0");
const rgb = argb => "#" + hex((argb >>> 16) & 255) + hex((argb >>> 8) & 255) + hex(argb & 255);

function range(c) {
  if (c.step) return { min: c.min, max: c.max, step: c.step };
  const v = Math.abs(c.value);
  const whole = c.type === "int" || c.type === "long";
  if (!whole && v <= 1) return { min: 0, max: c.value < 0 ? 1 : Math.max(1, v * 2), step: 0.01 };
  const max = Math.max(whole ? 10 : 2, Math.ceil(v * 3));
  return { min: c.value < 0 ? -max : 0, max, step: whole ? 1 : max / 200 };
}

function numberRow(c) {
  const row = document.createElement("div");
  row.className = "row";
  const label = document.createElement("label");
  label.textContent = c.name;
  label.title = (c.doc || "") + "\n" + (c.file ? c.file + ".java line " + c.line + ", " : "") + "was " + c.value;
  const r = range(c);
  const slider = Object.assign(document.createElement("input"), { type: "range", min: r.min, max: r.max, step: r.step });
  const box = Object.assign(document.createElement("input"), { type: "number", step: r.step });
  const undo = Object.assign(document.createElement("button"), { textContent: "↺", title: "Reset" });
  const show = v => { slider.value = v; box.value = v; row.classList.toggle("changed", c.id in changed); };
  const set = async v => {
    if (v === "" || isNaN(Number(v))) return;
    changed[c.id] = Number(v); show(Number(v)); count();
    await post("/api/set", new URLSearchParams({ id: c.id, value: v }));
  };
  slider.oninput = () => set(slider.value);
  box.onchange = () => set(box.value);
  undo.onclick = async () => { delete changed[c.id]; show(c.value); count();
    await post("/api/reset", new URLSearchParams({ id: c.id })); };
  row.append(label, slider, box, undo);
  show(c.id in changed ? changed[c.id] : c.value);
  return row;
}

function colorRow(c) {
  const row = document.createElement("div");
  row.className = "row color";
  const label = document.createElement("label");
  label.textContent = c.name;
  label.title = (c.doc || "") + (c.file ? "\n" + c.file + ".java line " + c.line : "");
  const pick = Object.assign(document.createElement("input"), { type: "color" });
  const alpha = Object.assign(document.createElement("input"), { type: "range", min: 0, max: 255, step: 1, title: "Opacity" });
  const undo = Object.assign(document.createElement("button"), { textContent: "↺", title: "Reset" });
  const show = v => { pick.value = rgb(v); alpha.value = v >>> 24; row.classList.toggle("changed", c.id in changed); };
  const set = async () => {
    const v = ((Number(alpha.value) << 24) | parseInt(pick.value.slice(1), 16)) >>> 0;
    changed[c.id] = v; show(v); count();
    await post("/api/set", new URLSearchParams({ id: c.id, value: v }));
  };
  pick.oninput = set; alpha.oninput = set;
  undo.onclick = async () => { delete changed[c.id]; show(c.value >>> 0); count();
    await post("/api/reset", new URLSearchParams({ id: c.id })); };
  row.append(label, pick, alpha, undo);
  show((c.id in changed ? changed[c.id] : c.value) >>> 0);
  return row;
}

function group(title, items, make, open) {
  const details = document.createElement("details");
  details.open = open;
  const summary = document.createElement("summary");
  summary.textContent = title + " ";
  summary.append(Object.assign(document.createElement("small"), { textContent: items.length }));
  details.append(summary);
  const fill = () => { if (details.childElementCount === 1) items.forEach(i => details.append(make(i))); };
  details.addEventListener("toggle", fill);
  if (open) fill();
  return details;
}

function build() {
  const words = $("search").value.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = c => words.every(w => (c.id + " " + c.name + " " + (c.doc || "")).toLowerCase().includes(w));
  const list = $("list");
  list.textContent = "";
  const open = words.length > 0;
  const make = c => c.type === "Color" ? colorRow(c) : numberRow(c);
  const isPane = c => c.id.startsWith("depth:pane.");
  const isLayer = c => isPane(c) || c.id === "depth:separation" || c.id === "depth:layerSide";
  const page = $("scene").value.replace("Window: ", "").split(" ")[0] + ": ";
  const layers = schema.depth.filter(c => isLayer(c) && hit(c) &&
    (words.length || !isPane(c) || c.id.startsWith("depth:pane." + page)));
  if (layers.some(isPane))
    list.append(group(words.length ? "NEW: pane heights" : "NEW: pane heights on this page", layers, make, true));
  const depth = schema.depth.filter(c => !isLayer(c) && hit(c));
  if (depth.length) list.append(group("NEW: depth and light", depth, make, true));
  const theme = schema.themeColors.filter(c => c.theme === $("theme").value && hit(c));
  if (theme.length) list.append(group("Theme colours (" + $("theme").value + ")", theme, colorRow, open));
  const files = {};
  schema.controls.filter(hit).forEach(c => {
    const title = c.holder ? c.file + " (inside drawing code)" : c.file;
    (files[title] = files[title] || []).push(c);
  });
  Object.keys(files).sort().forEach(f =>
    list.append(group(f, files[f], make, open && files[f].length < 40)));
}

const find = id => schema.controls.concat(schema.themeColors, schema.depth).find(x => x.id === id);
const SIDE_NAMES = { x: "across", y: "down", w: "width", h: "height", f: "text size" };

/* What a change is called, and what it went from and to. */
function told(id, value) {
  if (id.startsWith("layout:")) {
    const dot = id.lastIndexOf("."), name = id.slice(7, dot), side = id.slice(dot + 1);
    let label = name;
    if (name.startsWith("el|")) {
      const [, owner, kind] = name.split("|");
      label = owner.replace(/(Painter|Page)\./, " ") + ": " + kind;
    }
    return { label: label + ", " + SIDE_NAMES[side], was: "", now: (value > 0 ? "+" : "") + value };
  }
  const c = find(id) || {};
  const color = c.type === "Color" || id.startsWith("theme:");
  const show = v => v === undefined ? "?" : color ? "#" + (v >>> 0).toString(16).padStart(8, "0") : +(+v).toFixed(3);
  const label = id.startsWith("theme:") ? id.slice(6) : c.file ? c.file + ": " + c.name : c.name || id;
  return { label, was: show(c.value), now: show(value) };
}

function count() {
  const ids = Object.keys(changed);
  $("count").textContent = ids.length ? ids.length + " changed" : "";
  $("mine").hidden = !ids.length;
  $("mineCount").textContent = ids.length;
  const body = $("mine").lastElementChild;
  body.textContent = "";
  ids.forEach(id => {
    const t = told(id, changed[id]);
    const row = Object.assign(document.createElement("div"), { className: "mine", title: id });
    const undoOne = Object.assign(document.createElement("button"), { textContent: "↺", title: "Put this one back" });
    undoOne.onclick = async () => {
      delete changed[id];
      await post("/api/reset", { id });
      refresh();
    };
    row.append(Object.assign(document.createElement("span"), { textContent: t.label }),
      Object.assign(document.createElement("b"), { textContent: t.was === "" ? t.now : t.was + " → " + t.now }), undoOne);
    body.append(row);
  });
}

function refresh() {
  count();
  build();
  loadBoxes();
}

async function travel(way) {
  const reply = await fetch("/api/" + way, { method: "POST", headers: { "X-UI-Lab": "1" } });
  if (!reply.ok) return;
  changed = await reply.json();
  refresh();
}
$("undo").onclick = () => travel("undo");
$("redo").onclick = () => travel("redo");
window.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey) || ["search", "text", "number"].includes(document.activeElement.type)) return;
  const key = e.key.toLowerCase();
  if (key === "z" || key === "y") {
    e.preventDefault();
    travel(key === "y" || e.shiftKey ? "redo" : "undo");
  }
});

$("keep").onclick = async () => {
  if (!Object.keys(changed).length) { $("note").textContent = "Nothing is changed yet."; return; }
  const name = prompt("Name for this preset (letters, digits, spaces):", "my preset");
  if (!name) return;
  const reply = await fetch("/api/save?name=" + encodeURIComponent(name),
    { method: "POST", headers: { "X-UI-Lab": "1" }, body: JSON.stringify(preset(), null, 2) });
  $("note").textContent = reply.ok ? "Saved " + (await reply.json()).saved : await reply.text();
};

function preset() {
  const all = schema.controls.concat(schema.themeColors, schema.depth);
  return Object.entries(changed).map(([id, value]) => {
    const c = all.find(x => x.id === id) || {};
    const color = c.type === "Color" || id.startsWith("theme:");
    const show = v => color ? "0x" + (v >>> 0).toString(16).padStart(8, "0").toUpperCase() : v;
    const file = c.file || (id.startsWith("depth:") ? "LabDepth (new effect)" : "WindowTheme");
    const entry = { id, from: show(c.value), to: show(value), was: c.value, value, file, line: c.line || null };
    if (id.startsWith("layout:el|")) {
      const [, method, kind, ...rest] = id.slice(7, id.lastIndexOf(".")).split("|");
      return { id, from: 0, to: value, value, file: method.split(".")[0] + ".java", element: kind,
        method: method.split(".")[1], source: rest.join("|"), side: id.slice(id.lastIndexOf(".") + 1) };
    }
    if (id.startsWith("layout:"))
      return { id, from: 0, to: value, value, file: id.slice(7).split(":")[0] + " layout (change in layout units)" };
    if (c.holder) entry.source = c.doc;
    return entry;
  });
}

async function start() {
  schema = await (await fetch("/api/schema")).json();
  changed = Object.assign({}, schema.changed);
  schema.scenes.forEach(s => $("scene").add(new Option(s)));
  schema.themes.forEach(s => $("theme").add(new Option(s)));
  $("theme").value = "Glass bronze";
  const saved = JSON.parse(localStorage.getItem("uilab") || "{}");
  if (schema.scenes.includes(saved.scene)) $("scene").value = saved.scene;
  build(); count(); tick();
  if (schema.skipped.length)
    $("note").textContent = schema.skipped.length + " saved changes no longer fit the code and were left out "
      + "(a copy is in tools/ui-lab/.autosave.before-skips.json).";
}

const remember = () => localStorage.setItem("uilab", JSON.stringify({ scene: $("scene").value }));
$("search").oninput = build;
$("theme").onchange = build;
$("scene").onchange = () => { t = 0; remember(); build(); };
$("scale").oninput = () => $("scaleText").textContent = Number($("scale").value).toFixed(2);
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play";
  $("play").classList.toggle("on", playing); };
$("restart").onclick = async () => { await post("/api/restart"); t = 0; };
$("scrub").oninput = () => { playing = false; $("play").textContent = "Play"; $("play").classList.remove("on");
  t = Number($("scrub").value); };
$("compare").onpointerdown = () => original = true;
window.addEventListener("pointerup", () => original = false);
$("resetAll").onclick = async () => { changed = {}; await post("/api/reset"); count(); build(); loadBoxes(); };
$("export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(preset(), null, 2)], { type: "application/json" }));
  a.download = "ui-preset.json";
  a.click();
};
$("import").onclick = () => $("file").click();
$("file").onchange = async () => {
  const file = $("file").files[0];
  if (!file) return;
  let entries = [], left = 0;
  try { entries = JSON.parse(await file.text()); } catch (e) { $("note").textContent = "That file is not a preset."; }
  gesture++;
  for (const entry of entries) {
    let id = entry.id;
    /* Presets made before IDs were stable name a value by line and column. */
    const old = /^(\w+):@(\d+)\.(\d+)$/.exec(id);
    if (old) {
      const c = schema.controls.find(x => x.file === old[1] && x.key === "v" + old[2] + "_" + old[3]
        && x.doc === entry.source);
      if (c) id = c.id;
    }
    if (await post("/api/set", { id, value: entry.value })) changed[id] = Number(entry.value);
    else left++;
  }
  if (entries.length)
    $("note").textContent = "Loaded " + (entries.length - left) + " changes"
      + (left ? "; " + left + " no longer fit the code." : ".");
  $("file").value = "";
  count(); build(); loadBoxes();
};

const SIDES = ["x", "y", "w", "h", "f"];
const hasText = b => b && b.name.startsWith("el|") && ["text", "name", "paragraph", "button", "chip"]
  .includes(b.name.split("|")[2]);
let editing = false, boxList = [], picked = null, dragging = null;

async function loadBoxes() {
  if (!editing || dragging) return;
  const inside = $("mode").value === "elements";
  const reply = await fetch((inside ? "/api/elements?" : "/api/boxes?") + params({}));
  boxList = reply.ok ? await reply.json() : [];
  boxList.forEach(b => { b.label = b.name; b.name = b.key || b.name; });
  drawBoxes();
}

function place(div, b) {
  const zoom = Number($("zoom").value);
  Object.assign(div.style, { left: b.x * zoom + "px", top: b.y * zoom + "px", width: b.w * zoom + "px",
    height: b.h * zoom + "px" });
}

function drawBoxes() {
  const layer = $("boxes");
  layer.textContent = "";
  if (!editing) return;
  [...boxList].sort((a, b) => b.w * b.h - a.w * a.h).forEach(b => {
    const div = document.createElement("div");
    div.className = "box" + (b.name === picked ? " picked" : "");
    div.title = b.label;
    div.dataset.name = b.name;
    place(div, b);
    ["e", "s", "se"].forEach(side => div.append(Object.assign(document.createElement("i"), { className: side })));
    div.onpointerdown = e => startDrag(e, b, div, e.target.tagName === "I" ? e.target.className : "move");
    layer.append(div);
  });
  describe();
}

function describe() {
  const b = boxList.find(x => x.name === picked);
  $("resetBox").style.visibility = b ? "visible" : "hidden";
  $("textSize").style.visibility = hasText(b) ? "visible" : "hidden";
  $("pickedText").textContent = b
    ? b.label + (boxList.filter(x => x.name === b.name).length > 1 ? "  (all copies move)" : "") + "   moved " + b.change[0] + ", " + b.change[1] + "   resized " + b.change[2] + " wide, " + b.change[3]
      + " tall" + (hasText(b) ? ", text size " + (b.change[4] || 0) : "")
    : boxList.length ? "Drag a box to move it, or a yellow handle to resize it. Arrows move; Shift+arrows resize."
      : "No panes to rearrange in this scene. Pick a window page, or move things inside them.";
}

async function setChange(name, change) {
  for (let i = 0; i < SIDES.length; i++) {
    const id = "layout:" + name + "." + SIDES[i];
    if (change[i] === (changed[id] || 0)) continue;
    if (change[i]) {
      changed[id] = change[i];
      await post("/api/set", new URLSearchParams({ id, value: change[i] }));
    } else {
      delete changed[id];
      await post("/api/reset", new URLSearchParams({ id }));
    }
  }
  count();
}

function snapped(value, others, reach) {
  let best = null;
  others.forEach(edge => value.forEach(mine => {
    const gap = edge - mine;
    if (Math.abs(gap) <= reach && (best === null || Math.abs(gap) < Math.abs(best))) best = gap;
  }));
  return best || 0;
}

function startDrag(event, b, div, mode) {
  event.preventDefault();
  picked = b.name;
  document.querySelectorAll(".box").forEach(x => x.classList.toggle("picked", x.dataset.name === b.name));
  describe();
  div.setPointerCapture(event.pointerId);
  const zoom = Number($("zoom").value), scale = Number($("scale").value);
  const from = { x: event.clientX, y: event.clientY, box: Object.assign({}, b), change: [...b.change] };
  const others = boxList.filter(x => x.name !== b.name);
  const across = others.flatMap(x => [x.x, x.x + x.w]), down = others.flatMap(x => [x.y, x.y + x.h]);
  let change = from.change;
  dragging = b.name;
  div.onpointermove = e => {
    let dx = (e.clientX - from.x) / zoom, dy = (e.clientY - from.y) / zoom;
    const o = from.box, move = mode === "move";
    if ($("snap").checked && !e.altKey) {
      if (move || mode !== "s")
        dx += snapped(move ? [o.x + dx, o.x + o.w + dx] : [o.x + o.w + dx], across, 5);
      if (move || mode !== "e")
        dy += snapped(move ? [o.y + dy, o.y + o.h + dy] : [o.y + o.h + dy], down, 5);
    }
    const ux = Math.round(dx / scale), uy = Math.round(dy / scale);
    const add = move ? [ux, uy, 0, 0, 0] : [0, 0, mode === "s" ? 0 : ux, mode === "e" ? 0 : uy, 0];
    change = from.change.map((v, i) => v + add[i]);
    place(div, { x: o.x + add[0] * scale, y: o.y + add[1] * scale, w: Math.max(0, o.w + add[2] * scale),
      h: Math.max(0, o.h + add[3] * scale) });
    b.change = change;
    describe();
  };
  div.onpointerup = async () => {
    div.onpointermove = div.onpointerup = null;
    await setChange(b.name, change);
    dragging = null;
    loadBoxes();
  };
}

window.addEventListener("keydown", async e => {
  const b = boxList.find(x => x.name === picked);
  const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!editing || !b || !step || ["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
  e.preventDefault();
  const at = e.shiftKey ? 2 : 0;
  b.change[at] += step[0];
  b.change[at + 1] += step[1];
  await setChange(b.name, b.change);
  loadBoxes();
});

$("edit").onclick = () => {
  editing = !editing;
  picked = null;
  $("edit").classList.toggle("on", editing);
  $("picked").style.display = editing ? "flex" : "none";
  if (editing) loadBoxes(); else drawBoxes();
};
$("resetBox").onclick = async () => { await setChange(picked, [0, 0, 0, 0, 0]); loadBoxes(); };
async function sizeText(step) {
  const b = boxList.find(x => x.name === picked);
  if (!editing || !hasText(b)) return;
  b.change[4] += step;
  await setChange(b.name, b.change);
  loadBoxes();
}
$("smaller").onclick = () => sizeText(-1);
$("bigger").onclick = () => sizeText(1);
window.addEventListener("keydown", e => {
  if (["INPUT", "SELECT"].includes(document.activeElement.tagName) || e.ctrlKey) return;
  if (e.key === "+" || e.key === "=") sizeText(1);
  if (e.key === "-") sizeText(-1);
});
$("zoom").addEventListener("change", drawBoxes);
$("mode").onchange = () => { picked = null; loadBoxes(); };
["scene", "scale", "theme"].forEach(id => $(id).addEventListener("change", () => setTimeout(loadBoxes, 100)));

let lastMove = 0;
function pointer(event, type) {
  const zoom = Number($("zoom").value), box = $("frame").getBoundingClientRect();
  post("/api/input", params({ type, x: (event.clientX - box.left) / zoom, y: (event.clientY - box.top) / zoom,
    button: event.button === 2 ? 3 : 1 }));
}
$("frame").onmousemove = e => { if (performance.now() - lastMove > 60) { lastMove = performance.now(); pointer(e, "move"); } };
$("frame").onmousedown = e => pointer(e, "click");
$("frame").oncontextmenu = e => e.preventDefault();
start();
</script>
</body>
</html>
